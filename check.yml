name: Crous alert

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 min (GitHub peut avoir un peu de retard)
  workflow_dispatch:          # bouton pour lancer à la main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les offres
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python check.py
      - name: Sauvegarder la liste
        run: |
          git config user.name "crous-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "maj liste"
          git push
